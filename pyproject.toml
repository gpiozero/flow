[project]
name = "gpiozero-flow"
version = "0.1.0"
description = "Visual node-based web app and GPIO agent for gpiozero"
readme = "gpiozero_flow/README.md"
requires-python = ">=3.11"
authors = [
    { name = "Ben Nuttall", email = "ben@bennuttall.com" }
]
keywords = ["raspberrypi", "gpiozero", "gpio"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Intended Audience :: Developers",
    "Topic :: Utilities",
]

dependencies = [
    "gpiozero",
    "websockets>=10.1",
]

[project.scripts]
gpiozero-agent = "gpiozero_flow.gpio_agent:main"
gpiozero-flow = "gpiozero_flow.serve:main"

[project.urls]
Homepage = "https://flow.bennuttall.com/"

# webapp/ isn't in the source tree (see gpiozero_flow/__init__.py) — `npm run
# build` must run first so dist/ exists, then this force-include mapping
# pulls it into the wheel/sdist unchanged.
[tool.hatch.build.targets.wheel]
packages = ["gpiozero_flow"]

[tool.hatch.build.targets.wheel.force-include]
"dist" = "gpiozero_flow/webapp"

[tool.hatch.build.targets.sdist]
include = ["gpiozero_flow"]
# dist/ is .gitignore'd (a build artifact, not tracked source), so it needs
# artifacts= rather than include= to survive into the sdist.
artifacts = ["dist"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"